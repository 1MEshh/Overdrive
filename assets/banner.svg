<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2438" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.6" />

  <!-- Speed / telemetry accent lines -->
  <path d="M 0 40 L 1200 40" stroke="#1f293d" stroke-width="1" />
  <path d="M 0 320 L 1200 320" stroke="#1f293d" stroke-width="1" />
  <path d="M 120 0 L 160 360" stroke="#00f2fe" stroke-width="1" opacity="0.1" />
  <path d="M 1080 0 L 1040 360" stroke="#00f2fe" stroke-width="1" opacity="0.1" />

  <!-- Hexagon telemetry icon emblem -->
  <g transform="translate(100, 105)">
    <polygon points="50,5 95,30 95,85 50,110 5,85 5,30" fill="#131726" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M 25 65 L 42 45 L 58 75 L 75 35" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="25" cy="65" r="3" fill="#ffffff" />
    <circle cx="42" cy="45" r="3" fill="#ffffff" />
    <circle cx="58" cy="75" r="3" fill="#ffffff" />
    <circle cx="75" cy="35" r="3.5" fill="#00f2fe" />
  </g>

  <!-- Main Title -->
  <text x="230" y="175" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="64" font-weight="900" letter-spacing="8" fill="url(#accent)">
    OVERDRIVE
  </text>

  <!-- Subtitle -->
  <text x="235" y="215" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="14" font-weight="600" letter-spacing="3" fill="#8892b0">
    LINUX GAMING OPTIMIZER &amp; FRAMETIME PACING TELEMETRY ENGINE
  </text>

  <!-- Feature Pills -->
  <g transform="translate(235, 245)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="26" rx="4" fill="#161b2c" stroke="#2a3352" stroke-width="1" />
    <text x="67" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">VALVE VDF/ACF</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="150" height="26" rx="4" fill="#161b2c" stroke="#2a3352" stroke-width="1" />
    <text x="220" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#4facfe" text-anchor="middle">PROTON / VKD3D</text>

    <!-- Pill 3 -->
    <rect x="305" y="0" width="130" height="26" rx="4" fill="#161b2c" stroke="#2a3352" stroke-width="1" />
    <text x="370" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">GAMESCOPE FSR</text>

    <!-- Pill 4 -->
    <rect x="445" y="0" width="165" height="26" rx="4" fill="#161b2c" stroke="#2a3352" stroke-width="1" />
    <text x="527" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#4facfe" text-anchor="middle">PACING JITTER MATH</text>

    <!-- Pill 5 -->
    <rect x="620" y="0" width="140" height="26" rx="4" fill="#161b2c" stroke="#2a3352" stroke-width="1" />
    <text x="690" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#00f2fe" text-anchor="middle">KERNEL DOCTOR</text>
  </g>

  <!-- Technical specs tag on right side -->
  <g transform="translate(1020, 120)">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#4a5578" letter-spacing="1">ARCH: X86_64</text>
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#4a5578" letter-spacing="1">EDITION: 2021</text>
    <text x="0" y="40" font-family="monospace" font-size="11" fill="#4a5578" letter-spacing="1">MEMORY: ZERO-LEAK</text>
    <text x="0" y="60" font-family="monospace" font-size="11" fill="#4a5578" letter-spacing="1">STATUS: PRODUCTION</text>
  </g>
</svg>
