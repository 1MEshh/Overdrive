[package]
name = "overdrive"
version = "0.1.0"
edition = "2021"
description = "High-performance Linux gaming optimizer, Steam launch wrapper compiler, Proton/VKD3D environment tweaker, and frametime pacing telemetry engine."
license = "MIT OR Apache-2.0"
authors = ["1MEshh <152591660+1MEshh@users.noreply.github.com>"]
repository = "https://github.com/1MEshh/Overdrive"
readme = "README.md"

[[bin]]
name = "overdrive"
path = "src/main.rs"

[lib]
name = "overdrive"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
